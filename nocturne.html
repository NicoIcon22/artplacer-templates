<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne — ArtPlacer Website Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Nunito+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{display:inline-flex;width:1.1em;height:1.1em;vertical-align:-.18em}
.ico svg{width:100%;height:100%}
/* ArtPlacer slots */
.ap-slot{position:relative}
.ap-embed:empty{display:none}
.ap-fallback{display:none}
body.ap-offline .ap-slot .ap-fallback{display:flex;flex-direction:column;gap:.6rem;padding:1.1rem 1.2rem;border:1px dashed currentColor;opacity:.75;font-size:.82rem;line-height:1.4}
body.ap-offline .ap-slot--ve .ap-fallback{min-height:220px;justify-content:center;align-items:center;text-align:center}
.ap-fb-title{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
.ap-fb-pills{display:flex;flex-wrap:wrap;gap:.4rem}
.ap-fb-pills span{border:1px solid currentColor;padding:.35rem .7rem;border-radius:99px;font-size:.75rem}
.ap-fb-note{opacity:.7;font-size:.75rem}
/* toast */
#ap-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111;color:#fff;padding:.7rem 1.1rem;font:500 14px/1 system-ui,sans-serif;transition:.25s;z-index:999;border-radius:4px}
#ap-toast.on{opacity:1;transform:translate(-50%,0)}
/* template badge */
.tpl-badge{position:fixed;right:14px;bottom:14px;z-index:900;display:flex;gap:.5rem;align-items:center;background:rgba(17,17,17,.92);color:#fff;font:500 12px/1 system-ui,sans-serif;padding:.55rem .75rem;border-radius:99px;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.tpl-badge b{font-weight:700}
.form-thanks{padding:1.2rem 0;font-size:1.05rem}
.ap-ve{position:relative;width:100%;background:#000;line-height:0}
.ap-ve iframe{display:block;width:100%;height:clamp(320px,62vh,640px);border:0}
/* ArtPlacer button grid (per graphic) */
.ap-hidden{display:none!important}
body.ap-offline .ap-slot .ap-fallback{display:none}
.apb-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:420px}
/* popup */
/* if a visitor leaves an artwork page before ArtPlacer finishes placing its button, never show it floating */

.ap-sr{margin-top:10px}
/* ArtPlacer buttons (.artplacer-button) — View in AR, Try in your room, View in a room: ArtPlacer sets inline styles, so overrides need !important.
   Shared layout: the three buttons are stacked, all the same width and height — View in AR, Try in your room (.apb-grid), then View in a room (.ap-sr). All three share one unselected style; none is highlighted until hovered. Colours and type are set per template. */
.ap-sr{max-width:420px}
.ap-slot artplacer{display:block}
.artplacer-ar-icon{font-size:20px!important;line-height:1!important;letter-spacing:0!important;text-transform:none!important;margin-right:8px!important;flex:none}
.artplacer-button{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;max-width:100%!important;min-height:46px!important;margin:0!important;padding:10px 18px!important;line-height:1.2!important;box-sizing:border-box!important;text-decoration:none!important;transition:background-color .15s,color .15s,border-color .15s,transform .15s,box-shadow .15s}
.artplacer-button:focus-visible{outline:2px solid currentColor!important;outline-offset:3px!important}

:root{--bg:#0b0b0c;--bg2:#141416;--fg:#f2f0ec;--dim:#8c8a86;--line:#26262a;--acc:#d8c7a3;--pad:clamp(16px,4vw,64px)}
body{background:var(--bg);color:var(--fg);font:300 16px/1.6 "Archivo",system-ui,sans-serif;font-stretch:100%;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
.dim{color:var(--dim)}
h1,h2,h3,.logo,.ft-big,.overlay nav a{font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;margin:0}
.tag{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:500;margin:0 0 10px}
.wrap{padding:0 var(--pad);max-width:1600px;margin:0 auto}
section{margin-bottom:110px}
.hd{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad);background:linear-gradient(var(--bg),rgba(11,11,12,.0));}
.hd:not(.over){background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-size:28px;letter-spacing:.06em}
.hd-r{display:flex;gap:22px;align-items:center}
.cartb{display:flex;gap:6px;align-items:center;font-size:14px}
.menub{background:none;border:1px solid var(--fg);border-radius:99px;padding:7px 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
main{padding-top:0}
body:not([data-route=home]):not([data-route=exhibition]) main{padding-top:84px}
body[data-route=artist] main,body[data-route=bio] main,body[data-route=works] main,body[data-route=artistExhibitions] main,body[data-route=artistNews] main,body[data-route=links] main,body[data-route=artistContact] main{padding-top:0}
.overlay{position:fixed;inset:0;z-index:80;background:#050505;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);opacity:0;pointer-events:none;transition:opacity .35s}
body.menu-open .overlay{opacity:1;pointer-events:auto}
.overlay nav{display:flex;flex-direction:column;gap:6px}
.overlay nav a{font-size:clamp(48px,9vw,120px);display:flex;align-items:flex-start;gap:16px;transition:color .2s}
.overlay nav a small{font-size:13px;letter-spacing:.1em;color:var(--dim);font-weight:400;padding-top:12px}
.overlay nav a:hover,.overlay nav a.on{color:var(--acc)}
.closeb{position:absolute;top:22px;right:var(--pad);background:none;border:0;font-size:30px}
.ov-ft{position:absolute;bottom:32px;font-size:13px}
.slides{position:relative;height:100vh;min-height:560px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s}
.slide.on img{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
.slide-txt{position:absolute;z-index:2;left:var(--pad);bottom:90px;right:var(--pad)}
.slide-txt h2{font-size:clamp(56px,11vw,180px)}
.slide-txt p{margin:14px 0 0;font-size:17px}
.dots{position:absolute;z-index:3;bottom:40px;left:var(--pad);display:flex;gap:10px}
.dots button{width:36px;height:2px;border:0;background:rgba(255,255,255,.35);padding:0}
.dots button.on{background:var(--fg)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:96px 0 32px;border-bottom:1px solid var(--line);padding-bottom:14px}
.sh h2{font-size:clamp(28px,3vw,44px)}
.sh a{font-size:13px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.names a{position:relative;display:block;border-bottom:1px solid var(--line);padding:18px 0}
.names span{font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(36px,6vw,88px);line-height:1;color:var(--dim);transition:color .25s}
.names img{position:absolute;right:8%;top:50%;width:220px;transform:translateY(-50%) rotate(-3deg);opacity:0;transition:.35s;pointer-events:none;z-index:2}
.names a:hover span{color:var(--fg)}.names a:hover img{opacity:1;transform:translateY(-50%) rotate(0)}
.exrow{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:32px 0;border-bottom:1px solid var(--line);align-items:center}
.exrow-img{overflow:hidden}.exrow img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .6s}
.exrow:hover img{transform:scale(1.04)}
.exrow h3{font-size:clamp(36px,4.6vw,72px);margin-bottom:12px}
.exrow p{margin:4px 0}.exrow .ico{margin-top:20px;font-size:26px}
.ve-band{position:relative;min-height:70vh;display:flex;align-items:center;padding:0 var(--pad)}
.ve-band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}.ve-band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 20%,transparent)}
.ve-band>div{position:relative;max-width:640px}.ve-band h2{font-size:clamp(44px,6vw,96px);margin-bottom:16px}
.btn{display:inline-flex;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:14px 26px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:99px}
.btn:hover{background:var(--acc);border-color:var(--acc)}
.btn-g{background:none;color:var(--fg)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.nc-img{overflow:hidden;margin-bottom:16px}.nc img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s}.nc:hover img{transform:scale(1.05)}
.nc h3{font-size:26px;line-height:1}
.phd{padding:80px var(--pad) 40px}.phd h1{font-size:clamp(64px,12vw,200px)}.phd p{margin:12px 0 0}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 32px}
.ac img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(.6) brightness(.85);transition:.5s}
.ac:hover img{filter:none}.ac h3{font-size:34px;margin:16px 0 6px}.ac p{margin:0;font-size:14px}
.ahero{position:relative;height:78vh;min-height:480px;margin:0;overflow:hidden}
.ahero>img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) blur(2px);transform:scale(1.05)}
.ahero-in{position:absolute;left:var(--pad);bottom:48px;right:var(--pad)}
.ahero h1{font-size:clamp(60px,12vw,190px);margin:12px 0}
.subnav{position:sticky;top:76px;z-index:40;display:flex;gap:6px;overflow-x:auto;padding:14px var(--pad);background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:64px;scrollbar-width:none}
.subnav a{white-space:nowrap;padding:8px 16px;border-radius:99px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.subnav a.on{background:var(--fg);color:var(--bg)}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.lead{font-size:clamp(22px,2.4vw,32px);line-height:1.3;font-weight:300;margin:0}
.lnk{display:inline-flex;gap:8px;align-items:center;color:var(--acc);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px}
.tile-img{background:var(--bg2);aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:14%}
.tile-img img{max-height:100%;width:auto;box-shadow:0 18px 40px rgba(0,0,0,.6);transition:transform .4s}
.tile:hover img{transform:translateY(-6px)}
.tile-cap{display:flex;justify-content:space-between;gap:12px;padding-top:14px;font-size:14px}
.socrow{display:flex;gap:28px;flex-wrap:wrap}.socrow a{display:flex;gap:8px;align-items:center}
.bio{display:grid;grid-template-columns:1fr 2fr;gap:56px}.bio img{width:100%}
.prose{max-width:680px}.prose p{margin:0 0 1.1em}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:48px;border-top:1px solid var(--line);padding-top:32px}
.cv h4{margin:0 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:500}.cv p{margin:0 0 6px;font-size:14px}
.stage{position:relative;height:calc(100vh - 84px);min-height:480px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#232326,#0b0b0c 70%);margin:0 0 64px}
.stage img{max-height:76%;max-width:70%;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.nav-l,.nav-r{position:absolute;top:50%;transform:translateY(-50%);font-size:60px;font-weight:200;color:var(--dim);padding:20px}
.nav-l{left:var(--pad)}.nav-r{right:var(--pad)}.nav-l:hover,.nav-r:hover{color:var(--fg)}
.wd{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.wd-t h1{font-size:clamp(44px,6vw,96px);margin-top:10px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0;border-top:1px solid var(--line)}
.specs div{padding:16px 0;border-bottom:1px solid var(--line)}
.specs dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.specs dd{margin:4px 0 0;font-size:17px}
.wd-act{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.apbox{background:var(--bg2);padding:28px;border-left:2px solid var(--acc)}.apbox p{margin:0 0 14px;font-size:14px}
.xhero{position:relative;height:100vh;min-height:560px;margin-bottom:96px}
.xhero>img{width:100%;height:100%;object-fit:cover}.xhero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.8))}
.xhero-in{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:64px}.xhero-in>a{display:block;margin-bottom:24px}
.xhero h1{font-size:clamp(60px,13vw,210px);margin-bottom:14px}.xhero p{margin:4px 0;font-size:18px}
.vex{background:var(--bg2);padding:4px 0 72px}.vex-box{border:1px solid var(--line);padding:0;background:#0f0f11}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:16px}.mosaic img{width:100%;height:100%;object-fit:cover}.mosaic img:first-child{grid-row:span 2}
.art{max-width:860px;margin:0 auto;padding:64px var(--pad) 0}.art>a{display:block;margin-bottom:28px}.art h1{font-size:clamp(40px,6vw,84px);margin-bottom:40px}.art img{width:100%;margin-bottom:40px}
.rel{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.socgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.socgrid a{background:var(--bg2);padding:28px;display:grid;gap:8px;transition:background .2s}.socgrid a:hover{background:#1d1d20}.socgrid .ico{font-size:26px}
.xl{display:grid;grid-template-columns:1fr 1fr auto;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);font-size:18px;align-items:center}.xl:hover{color:var(--acc)}
.ct2{display:grid;grid-template-columns:1fr 1.4fr;gap:64px}.ct2 p{margin:0 0 28px}
.form{display:grid;gap:22px}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.form label{display:grid;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.form input,.form textarea{background:var(--bg2);border:1px solid var(--line);padding:14px;color:var(--fg);font-size:15px;letter-spacing:0;text-transform:none;outline:0}
.form input:focus,.form textarea:focus{border-color:var(--acc)}.form .btn{justify-self:start}
.enq{display:flex;gap:16px;align-items:center;margin-bottom:32px;padding:16px;background:var(--bg2)}.enq img{width:72px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px}.chips a{border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.chips a.on{border-color:var(--fg);color:var(--fg)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 28px}
.pc-img{display:flex;background:var(--bg2);aspect-ratio:4/5;align-items:center;justify-content:center;padding:12%}.pc-img img{max-height:100%;width:auto}
.pc-info{display:flex;justify-content:space-between;gap:16px;padding-top:14px;font-size:15px}.pc-info>div:first-child{display:grid}
.pc-buy{text-align:right;display:grid;gap:4px;justify-items:end}.pc-buy button{background:none;border:0;color:var(--acc);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:0}
.stage-p img{max-width:40%}
.cart{max-width:960px}.ci{display:grid;grid-template-columns:90px 1fr auto 120px;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.ci img{width:90px;height:90px;object-fit:cover}
.qty{display:flex;gap:12px;align-items:center}.qty button{width:32px;height:32px;border-radius:99px;border:1px solid var(--line);background:none}
.tot{display:flex;justify-content:space-between;font-size:22px;padding:24px 0}
.ft{border-top:1px solid var(--line);padding:64px var(--pad) 48px}
.ft-big{font-size:clamp(80px,20vw,320px);color:#1c1c1f;line-height:.8;margin-bottom:48px}
.ft-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;font-size:14px}.ft-cols a{display:block;margin-bottom:6px}.ft-cols a:hover{color:var(--acc)}
.nl div{display:flex;border-bottom:1px solid var(--fg)}.nl input{flex:1;background:none;border:0;padding:10px 0;outline:0}.nl button{background:none;border:0}
.form-thanks{color:var(--acc)}
@media (max-width:900px){.exrow,.intro,.bio,.wd,.wd-act,.ct2{grid-template-columns:1fr}.tiles,.pg,.ag,.g3,.socgrid{grid-template-columns:1fr 1fr}.ft-cols{grid-template-columns:1fr 1fr}.cv{grid-template-columns:1fr}.names img{display:none}.stage img{max-width:80%}}
@media (max-width:600px){.tiles,.pg,.ag,.g3,.socgrid,.mosaic,.form .row{grid-template-columns:1fr}.mosaic img:first-child{grid-row:auto}.xl{grid-template-columns:1fr auto}.xl .dim{display:none}
  .ci{grid-template-columns:64px 1fr}.ci img{width:64px;height:64px}.specs{grid-template-columns:1fr}.subnav{top:74px}.nav-l,.nav-r{font-size:40px;padding:6px}.stage-p img{max-width:70%}}
/* ArtPlacer buttons — Nocturne */
.apb-grid{gap:12px;max-width:460px}
.apb-grid .artplacer-button,.ap-sr .artplacer-button{background-color:transparent!important;color:var(--fg)!important;border:1px solid var(--fg)!important;border-radius:99px!important;font:600 11px/1.2 "Archivo",sans-serif!important;letter-spacing:.16em!important;text-transform:uppercase!important;min-height:46px!important;padding:10px 18px!important}
.apb-grid .artplacer-button:hover,.ap-sr .artplacer-button:hover{background-color:var(--acc)!important;border-color:var(--acc)!important;color:var(--bg)!important}
.ap-sr{max-width:460px;margin-top:12px}
@media (max-width:640px){.apb-grid .artplacer-button,.ap-sr .artplacer-button{letter-spacing:.1em!important;padding:10px 8px!important}}

<script>/* ArtPlacer Website Templates — shared core (data, generative imagery, router, cart, widgets) */
(function () {
  'use strict';

  /* ---------- utilities ---------- */
  function hash(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
  function rng(seed) { let a = hash(String(seed)); return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TODAY = new Date('2026-10-07T12:00:00');
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = MONTHS.map(m => m.slice(0, 3));
  const d = s => new Date(s + 'T12:00:00');
  function fmtDate(s, short) { const x = d(s); return (short ? MON : MONTHS)[x.getMonth()] + ' ' + x.getDate() + ', ' + x.getFullYear(); }
  function fmtRange(a, b) { const x = d(a), y = d(b); if (x.getFullYear() === y.getFullYear()) return MON[x.getMonth()] + ' ' + x.getDate() + ' – ' + MON[y.getMonth()] + ' ' + y.getDate() + ', ' + y.getFullYear(); return fmtDate(a, 1) + ' – ' + fmtDate(b, 1); }
  const money = n => '$' + Number(n).toLocaleString('en-US');

  /* ---------- generative artwork (seeded SVG) ---------- */
  const cache = new Map();
  const uri = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  function layout(html, r) {
    const top = r.path.split('/')[0];
    return `<header class="hd ${r.name === 'home' || r.name === 'exhibition' || /^(artist|bio|works|artistExhibitions|artistNews|links|artistContact)$/.test(r.name) ? 'over' : ''}"><a class="logo" href="#/">HALDEN</a>
      <div class="hd-r"><a href="#/cart" class="cartb"><span class="ico">${$.ICON.bag}</span><span data-cart-count>0</span></a><button class="menub" data-toggle="menu-open">Menu</button></div></header>
      <div class="overlay"><button class="closeb" data-toggle="menu-open" aria-label="Close"><span class="ico">${$.ICON.close}</span></button><nav>${NAV.map(([k, l], i) => `<a href="#/${k}" class="${top === k ? 'on' : ''}"><small>0${i + 1}</small>${l}</a>`).join('')}</nav>
        <div class="ov-ft dim">${A.gallery.address.join(' · ')}<br>${A.gallery.hours}</div></div>
      <main>${html}</main>
      <footer class="ft"><div class="ft-big">HALDEN</div><div class="ft-cols"><div><h4 class="tag">Visit</h4><p class="dim">${A.gallery.address.join('<br>')}<br>${A.gallery.hours}</p></div><div><h4 class="tag">Explore</h4>${NAV.map(([k, l]) => `<a href="#/${k}">${l}</a>`).join('')}</div>
        <div><h4 class="tag">Follow</h4>${$.socialList(A.gallery.social).map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('')}</div>
        <form data-demo="You’re on the list." class="nl"><h4 class="tag">Newsletter</h4><div><input type="email" required placeholder="Your email"><button aria-label="Subscribe">${arrow}</button></div></form></div></footer>`;
  }
  let timer;
  function after(r) {
    clearInterval(timer);
    if (r.name !== 'home') return;
    const sl = [...document.querySelectorAll('.slide')], dots = [...document.querySelectorAll('[data-slide]')]; let i = 0;
    const go = n => { i = n; sl.forEach((s, j) => s.classList.toggle('on', j === i)); dots.forEach((s, j) => s.classList.toggle('on', j === i)); };
    dots.forEach(d => d.onclick = () => { go(+d.dataset.slide); clearInterval(timer); });
    timer = setInterval(() => go((i + 1) % sl.length), 5000);
  }
  window.THEME = { siteName: 'Halden Gallery', layout, views, after };
})();
</script><script>APT.start(window.THEME)</script>
<script src="https://widget.artplacer.com/js/script.js"></script>
