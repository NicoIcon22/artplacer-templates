<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic — ArtPlacer Website Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Space+Grotesk:wght@400;500&family=Nunito+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{display:inline-flex;width:1.1em;height:1.1em;vertical-align:-.18em}
.ico svg{width:100%;height:100%}
/* ArtPlacer slots */
.ap-slot{position:relative}
.ap-embed:empty{display:none}
.ap-fallback{display:none}
body.ap-offline .ap-slot .ap-fallback{display:flex;flex-direction:column;gap:.6rem;padding:1.1rem 1.2rem;border:1px dashed currentColor;opacity:.75;font-size:.82rem;line-height:1.4}
body.ap-offline .ap-slot--ve .ap-fallback{min-height:220px;justify-content:center;align-items:center;text-align:center}
.ap-fb-title{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
.ap-fb-pills{display:flex;flex-wrap:wrap;gap:.4rem}
.ap-fb-pills span{border:1px solid currentColor;padding:.35rem .7rem;border-radius:99px;font-size:.75rem}
.ap-fb-note{opacity:.7;font-size:.75rem}
/* toast */
#ap-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111;color:#fff;padding:.7rem 1.1rem;font:500 14px/1 system-ui,sans-serif;transition:.25s;z-index:999;border-radius:4px}
#ap-toast.on{opacity:1;transform:translate(-50%,0)}
/* template badge */
.tpl-badge{position:fixed;right:14px;bottom:14px;z-index:900;display:flex;gap:.5rem;align-items:center;background:rgba(17,17,17,.92);color:#fff;font:500 12px/1 system-ui,sans-serif;padding:.55rem .75rem;border-radius:99px;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.tpl-badge b{font-weight:700}
.form-thanks{padding:1.2rem 0;font-size:1.05rem}
.ap-ve{position:relative;width:100%;background:#000;line-height:0}
.ap-ve iframe{display:block;width:100%;height:clamp(320px,62vh,640px);border:0}
/* ArtPlacer button grid (per graphic) */
.ap-hidden{display:none!important}
body.ap-offline .ap-slot .ap-fallback{display:none}
.apb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:420px}
.apb{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:10px 14px;background:#f4f4f4;color:#111;border:0;border-radius:0;font:800 13px/1.15 "Nunito Sans",system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase;text-align:center;cursor:pointer;transition:background .15s}
.apb:hover{background:#e8e8e8}.apb:focus-visible{outline:2px solid #111;outline-offset:2px}
.apb-ico{display:inline-flex;width:22px;height:22px;flex:none}.apb-ico svg{width:100%;height:100%}
/* popup */
body.apm-open{overflow:hidden}
.apm{position:fixed;inset:0;z-index:1000;background:rgba(10,10,10,.62);display:flex;align-items:center;justify-content:center;padding:16px;animation:apmf .2s}
@keyframes apmf{from{opacity:0}}
.apm-box{background:#fff;color:#111;width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;font:400 14px/1.5 "Nunito Sans",system-ui,sans-serif;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.apm-hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid #eee}
.apm-hd b{display:block;font-weight:800;text-transform:uppercase;font-size:15px}.apm-hd span{color:#666;font-size:13px}
.apm-x{background:none;border:0;width:32px;height:32px;padding:4px;color:#111;cursor:pointer;flex:none}.apm-x svg{width:100%;height:100%}
.apm-ft{padding:10px 20px;border-top:1px solid #eee;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#999;text-align:right}
.apm-main{display:block;width:100%;height:auto}
.apm-sr .apm-thumbs{display:flex;gap:8px;padding:12px 20px}.apm-thumbs button{border:2px solid transparent;padding:0;background:none;width:96px;cursor:pointer}.apm-thumbs button.on{border-color:#111}.apm-thumbs img{display:block;width:100%}
.apm-ar{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:32px;padding:28px;align-items:center;background:#f7f7f7}
.apm-phone{width:100%;max-width:260px;margin:0 auto}
.apm-ar h4{font-size:22px;margin:0 0 12px;font-weight:800}.apm-ar ol{padding-left:18px;margin:0 0 20px}.apm-ar li{margin-bottom:6px}
.apm-qr{display:grid;grid-template-columns:repeat(7,14px);gap:2px;padding:10px;background:#fff;width:max-content;border:1px solid #ddd}.apm-qr i{width:14px;height:14px;background:#111}
.apm-yr{padding:20px}
.apm-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:340px;border:2px dashed #ccc;background:#fafafa;cursor:pointer;text-align:center;padding:20px}
.apm-drop b{font-size:16px;text-transform:uppercase;font-weight:800}.apm-drop span{color:#777;font-size:13px}.apm-drop:hover{border-color:#111}
.apm-stage{position:relative;overflow:hidden;background:#000;touch-action:none}.apm-stage .apm-bg{display:block;width:100%}
.apm-art{position:absolute;transform:translate(-50%,-50%);box-shadow:0 10px 24px rgba(0,0,0,.35);cursor:grab;max-width:none}
.apm-ctl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;color:#666;font-size:13px}.apm-ctl label{display:flex;gap:10px;align-items:center}
@media (max-width:640px){.apm-ar{grid-template-columns:1fr;padding:20px}.apm-phone{max-width:200px}.apm-qr{display:none}.apb{font-size:12px;padding:10px}}
.apm [hidden]{display:none!important}
.apm-imgwrap{display:flex;justify-content:center;background:#f4f4f4}
.apm-img{display:block;max-width:100%;height:auto;max-height:calc(100vh - 160px);width:auto}
.apm[data-mode=sample] .apm-box{width:min(560px,100%)}
.apm[data-mode=room] .apm-box,.apm[data-mode=ar] .apm-box{width:min(760px,100%)}
/* the live ArtPlacer button is triggered by the themed "View in sample room" button */
.ap-slot .ap-anchor,.ap-slot .ap-anchor~*{display:none!important}
.ap-slot .artplacer-button{display:none!important}

:root{--bg:#efede6;--fg:#121212;--acc:#ff4d1c;--acc2:#3a3df5;--card:#e3e0d6;--line:#121212;--rail:250px;--pad:clamp(16px,3.4vw,52px)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 "Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
h1,h2,h3,.logo,.mega,.aidx-n,.ft-l{font-family:"Syne",sans-serif;font-weight:800;letter-spacing:-.035em;line-height:.9;margin:0}
.mono{font-family:"Space Grotesk",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.mute{opacity:.55}
.pill{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--fg);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;background:var(--bg);white-space:nowrap}
.st-current{background:var(--acc);border-color:var(--acc);color:#fff}.st-upcoming{background:var(--acc2);border-color:var(--acc2);color:#fff}.vr{background:var(--fg);color:var(--bg)}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);border-right:1.5px solid var(--line);padding:28px 24px;display:flex;flex-direction:column;z-index:50;background:var(--bg)}
.logo{font-size:52px;display:block}.logo span{display:block;font:500 11px/1 "Space Grotesk";letter-spacing:.3em;text-transform:uppercase;margin-top:8px;color:var(--acc)}
.rnav{display:flex;flex-direction:column;margin-top:48px}
.rnav a{display:flex;align-items:baseline;gap:12px;font:700 24px/1 "Syne",sans-serif;letter-spacing:-.02em;padding:10px 0;border-bottom:1.5px solid var(--line);transition:padding .2s,color .2s}
.rnav a:first-child{border-top:1.5px solid var(--line)}
.rnav a:hover,.rnav a.on{color:var(--acc);padding-left:8px}
.rnav .mono{width:22px}.rnav .bi{width:14px;height:14px}
.rnav i{font-style:normal;font:500 12px/1 "Space Grotesk";background:var(--acc);color:#fff;border-radius:99px;padding:3px 7px;margin-left:auto}.rnav i.is-empty{background:none;color:inherit;border:1px solid}
.rail-ft{margin-top:auto;line-height:1.6;font-size:11px}.rsoc{display:flex;gap:14px;margin-top:14px;font-size:18px}
.burger{display:none;background:none;border:0;font-size:28px;padding:0}
.page{margin-left:var(--rail);min-width:0}
main{padding:0 var(--pad) 80px}
section{margin-top:110px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--line);padding-bottom:12px;margin:110px 0 36px}
.sh h2{font-size:clamp(40px,5.4vw,84px)}
.sh a{display:flex;gap:6px;align-items:center}
.btnk{display:inline-flex;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border:1.5px solid var(--fg);border-radius:99px;padding:14px 24px;font:500 14px/1 "Space Grotesk";transition:.2s}
.btnk:hover{background:var(--acc);border-color:var(--acc);color:#fff}.btnk.ghost{background:none;color:var(--fg)}
.hhero{display:grid;grid-template-columns:1fr 1fr;gap:32px;min-height:calc(100vh - 60px);align-items:center;margin-top:0;padding-top:24px}
.hhero h1{font-size:clamp(70px,10.5vw,200px);margin:20px 0}.hhero h1 a:hover{color:var(--acc)}.hhero p{font-size:20px;margin:0 0 28px}
.hhero-img{position:relative;height:80vh}
.hhero-img img{position:absolute;box-shadow:16px 16px 0 var(--fg)}
.hhero-img img:first-child{width:62%;right:2%;top:2%}.hhero-img img:last-child{width:46%;left:2%;bottom:4%;box-shadow:16px 16px 0 var(--acc)}
.mq{overflow:hidden;background:var(--acc);color:#fff;border-block:1.5px solid var(--line);margin:0 calc(var(--pad) * -1);white-space:nowrap}
.mq div{display:inline-flex;animation:mq 30s linear infinite}
.mq span{font:800 clamp(32px,4vw,56px)/1.25 "Syne";letter-spacing:-.02em;padding-right:.6em}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq div{animation:none}}
.scatter{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:start}
.sc{position:relative;display:block}.sc img{width:100%;transition:transform .35s}.sc:hover img{transform:rotate(-1.5deg) scale(1.02)}
.sc-cap{display:block;font-size:13px;padding-top:10px}.sc-cap b{display:block;font:700 18px/1.1 "Syne"}.sc-cap em{font-style:normal;color:var(--acc);margin-left:8px}
.s0{grid-column:1/6}.s1{grid-column:7/11;margin-top:120px}.s2{grid-column:11/13;margin-top:20px}.s3{grid-column:2/5;margin-top:-40px}.s4{grid-column:6/10;margin-top:60px}.s5{grid-column:10/13;margin-top:-80px}
.aidx a{position:relative;display:grid;grid-template-columns:50px 1fr auto;gap:20px;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line)}
.aidx-n{font-size:clamp(34px,5.5vw,92px);transition:color .2s}
.aidx img{position:absolute;right:140px;top:50%;height:160px;width:auto;transform:translateY(-50%) rotate(4deg) scale(.8);opacity:0;transition:.3s;pointer-events:none;box-shadow:10px 10px 0 var(--fg);z-index:2}
.aidx a:hover .aidx-n{color:var(--acc)}.aidx a:hover img{opacity:1;transform:translateY(-50%) rotate(4deg) scale(1)}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:40px 28px}
.exc-img{position:relative;border:1.5px solid var(--line);overflow:hidden}.exc-img img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .5s}.exc:hover img{transform:scale(1.04)}
.exc-img .pill{position:absolute;top:14px;left:14px}.exc-img .pill.vr{left:auto;right:14px}
.exc.alt{margin-top:80px}
.exc-t h3{font-size:clamp(34px,3.6vw,56px);margin:16px 0 8px}.exc-t p{margin:2px 0}.exc:hover h3{color:var(--acc)}
.nl{display:grid;grid-template-columns:40px 110px 1fr auto 24px;gap:20px;align-items:center;padding:20px 0;border-bottom:1.5px solid var(--line);transition:background .2s,padding .2s}
.nl:hover{background:var(--fg);color:var(--bg);padding-inline:14px}.nl:hover .pill{background:var(--fg);color:var(--bg);border-color:var(--bg)}
.nl-t{font:700 clamp(18px,1.8vw,26px)/1.15 "Syne";letter-spacing:-.01em}
.big{display:flex;align-items:flex-start;gap:12px;padding:56px 0 36px;border-bottom:1.5px solid var(--line);margin-bottom:40px}
.big h1{font-size:clamp(76px,13vw,230px)}.big sup{background:var(--acc);color:#fff;border-radius:99px;padding:6px 12px;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:48px}.chips a{border:1.5px solid var(--fg);border-radius:99px;padding:8px 18px;font-weight:500}.chips a.on,.chips a:hover{background:var(--fg);color:var(--bg)}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 28px}
.acard-img{background:var(--a1);padding:14%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);margin-bottom:14px}.acard-img img{max-height:100%;width:auto;box-shadow:10px 10px 0 var(--fg);transition:transform .3s}
.acard:hover img{transform:rotate(-3deg)}.acard h3{font-size:38px;margin:6px 0 8px}.acard p{margin:0;font-size:14px}
.ahd{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end;padding-top:48px;border-bottom:1.5px solid var(--line);padding-bottom:28px;position:relative}
.ahd h1{font-size:clamp(64px,10vw,180px);margin:18px 0}.ahd h1 br+*{color:var(--a1)}
.ahd img{max-height:56vh;width:auto;justify-self:end;box-shadow:16px 16px 0 var(--a1);border:1.5px solid var(--line)}
.atabs{display:flex;gap:0;overflow-x:auto;border-bottom:1.5px solid var(--line);margin:0 calc(var(--pad) * -1);padding:0 var(--pad);position:sticky;top:0;background:var(--bg);z-index:20;scrollbar-width:none}
.atabs a{display:flex;gap:8px;align-items:baseline;padding:16px 18px;font-weight:500;white-space:nowrap;border-right:1.5px solid var(--line)}.atabs a:first-child{border-left:1.5px solid var(--line)}
.atabs a.on{background:var(--fg);color:var(--bg)}.atabs a:hover:not(.on){color:var(--acc)}
.ain{padding-top:56px}
.mega{font-size:clamp(30px,3.8vw,58px);line-height:1.02;letter-spacing:-.03em}.mega.sm{font-size:clamp(24px,2.4vw,36px);line-height:1.1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:40px}.two p{margin:0 0 1em}
.big2{margin:72px 0}
.ul{display:inline-flex;gap:6px;align-items:center;border-bottom:1.5px solid;margin-top:8px;font-weight:500}.ul:hover{color:var(--acc)}
.sgrid{display:flex;gap:12px;flex-wrap:wrap}.sgrid a{display:flex;gap:10px;align-items:center;border:1.5px solid var(--fg);border-radius:99px;padding:12px 22px;font-weight:500}.sgrid a:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.sgrid.lg{display:grid;grid-template-columns:repeat(3,1fr)}.sgrid.lg a{border-radius:0;flex-direction:column;align-items:flex-start;padding:28px;gap:6px}.sgrid.lg .ico{font-size:30px}.sgrid.lg b{font:700 26px/1 "Syne"}
.bio{display:grid;grid-template-columns:1fr 2fr;gap:48px}.bio img{width:100%;border:1.5px solid var(--line);box-shadow:14px 14px 0 var(--acc)}.bio p{margin:0 0 1em}
.cvg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:72px;border-top:1.5px solid var(--line)}.cvg>div{padding:20px 20px 20px 0;border-right:1.5px solid var(--line)}.cvg>div+div{padding-left:20px}.cvg>div:last-child{border:0}.cvg h4{color:var(--acc);margin:0 0 12px}.cvg p{margin:0 0 8px;font-size:14px}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 28px}
.wc-img{background:var(--card);border:1.5px solid var(--line);aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:13%}.wc-img img{max-height:100%;width:auto;box-shadow:8px 8px 0 var(--fg);transition:transform .3s}
.wc:hover img{transform:translate(-4px,-4px)}.wc-cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-top:12px;font-size:14px}.wc-cap b{font:700 20px/1.1 "Syne";width:100%}
.wd{display:grid;grid-template-columns:1.3fr 1fr;margin:0 calc(var(--pad) * -1);min-height:100vh;border-bottom:1.5px solid var(--line)}
.wd-img{position:sticky;top:0;height:100vh;background:var(--a1,var(--card));display:flex;align-items:center;justify-content:center;padding:8%;border-right:1.5px solid var(--line)}
.wd-img img{max-height:80vh;width:auto;box-shadow:18px 18px 0 var(--fg)}
.wd-t{padding:48px var(--pad)}.cnt{float:right}
.wd-t h1{font-size:clamp(48px,5.5vw,92px);margin:40px 0 10px}.by{font-size:20px;margin:0 0 32px}
.specs{display:grid;grid-template-columns:110px 1fr;margin:0;border-top:1.5px solid var(--line)}.specs dt,.specs dd{padding:12px 0;border-bottom:1.5px solid var(--line);margin:0}.specs dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.price{font:800 clamp(36px,3.4vw,52px)/1 "Syne";letter-spacing:-.03em;margin:28px 0 20px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.apk{margin-top:36px;border:1.5px solid var(--line);padding:22px;background:#fff;box-shadow:8px 8px 0 var(--acc)}.apk-h{display:flex;gap:10px;align-items:center;font:700 22px/1 "Syne"}.apk p{margin:8px 0 12px;font-size:13px}
.pn{display:flex;justify-content:space-between;margin-top:40px}.pn a:hover{color:var(--acc)}
.xh{padding-top:48px}.xh-meta{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 18px;align-items:center}
.xh h1{font-size:clamp(76px,13vw,240px)}
.xh-row{display:grid;grid-template-columns:repeat(4,1fr);border-block:1.5px solid var(--line);margin-top:36px}.xh-row>div{padding:16px 16px 16px 0;border-right:1.5px solid var(--line)}.xh-row>div+div{padding-left:16px}.xh-row>div:last-child{border:0}.xh-row p{margin:6px 0 0;font-size:18px;font-weight:500}.xh-row a:hover{color:var(--acc)}
.xh-img{width:100%;margin-top:40px;border:1.5px solid var(--line)}
.vr-box{background:var(--fg);color:var(--bg);margin:0 calc(var(--pad) * -1)}.vr-box .mq{margin:0;background:var(--acc2)}
.vr-in{padding:64px var(--pad)}.vr-in h2{font-size:clamp(44px,6vw,100px);margin-bottom:32px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.views img{width:100%;border:1.5px solid var(--line)}
.na{max-width:980px;padding-top:48px}.na h1{font-size:clamp(44px,6vw,96px);margin-bottom:40px}.na img{width:100%;border:1.5px solid var(--line);margin-bottom:40px}.na-b{max-width:720px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.form{display:grid;gap:12px}.form input,.form textarea{background:transparent;border:1.5px solid var(--fg);border-radius:14px;padding:14px 18px;font-size:16px;outline:0}.form input:focus,.form textarea:focus{border-color:var(--acc);box-shadow:4px 4px 0 var(--acc)}.form .btnk{justify-self:start}
.enq{display:flex;gap:16px;align-items:center;margin:20px 0;padding:14px;border:1.5px solid var(--line)}.enq img{width:72px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 28px}
.pcard-img{position:relative;display:flex;aspect-ratio:1;background:var(--card);border:1.5px solid var(--line);align-items:center;justify-content:center;padding:12%}.pcard-img img{max-height:100%;width:auto}.pcard-img .pill{position:absolute;top:12px;left:12px}
.pcard-t{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-top:12px}.pcard-t b{display:block;font:700 19px/1.1 "Syne"}.pcard-t span{font-size:13px}
.buy{display:flex;gap:10px;align-items:center;background:none;border:1.5px solid var(--fg);border-radius:99px;padding:8px 6px 8px 14px;font-weight:500;white-space:nowrap}.buy span{background:var(--fg);color:var(--bg);border-radius:99px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}.buy:hover{background:var(--acc);border-color:var(--acc);color:#fff}

    artistNews({ artist: a }) { const ns = $.newsBy(a.id); return { title: a.name + ' — News', html: artistShell(a, 'news', ns.map((n, i) => newsLine(n, a, i)).join('') || '<p>No news yet.</p>') }; },
    newsItem({ item: n, artist: a }) {
      return { title: n.title, html: `<article class="na"><a class="mono" href="${a ? `#/artists/${a.id}/news` : '#/news'}">← ${a ? e(a.name) + ' / ' : ''}News</a><div class="xh-meta"><span class="pill">${e(n.cat)}</span><span class="mono">${$.fmtDate(n.date)}</span></div><h1>${e(n.title)}</h1>
        <img src="${n.ex ? $.exImages($.exById(n.ex))[3] : $.artURI($.worksBy(n.artists[0])[4])}" alt=""><div class="na-b">${n.body.map((p, i) => `<p class="${i ? '' : 'mega sm'}">${e(p)}</p>`).join('')}
        <div class="tags">${n.artists.map(id => `<a class="pill" href="#/artists/${id}">${e($.artistById(id).name)}</a>`).join('')}${n.ex ? `<a class="pill" href="#/exhibitions/${n.ex}">${e($.exById(n.ex).title)}</a>` : ''}</div></div></article>` };
    },
    links({ artist: a }) {
      return { title: a.name + ' — Social & Links', html: artistShell(a, 'links', `${sect('Social')}<div class="sgrid lg">${$.socialList(a.social).map(s => `<a href="${s.url}" target="_blank" rel="noopener"><span class="ico">${s.icon}</span><b>${s.name}</b><span class="mono">${s.handle}</span></a>`).join('')}</div>
        ${sect('Links')}${a.links.map(([t, u], i) => `<a class="nl" href="${u}" target="_blank" rel="noopener"><span class="mono">${pad(i + 1)}</span><span class="mono">${e(u.replace('https://', '').split('/')[0])}</span><span class="nl-t">${e(t)}</span><span></span><span class="ico">${$.ICON.ext}</span></a>`).join('')}`) };
    },
    artistContact({ artist: a, q }) {
      const w = q.get('work') && $.workById(q.get('work'));
      return { title: 'Contact — ' + a.name, html: artistShell(a, 'contact', `<div class="two"><div><p class="mega sm">Interested in ${e(a.name)}’s work? Let’s talk.</p>${w ? `<div class="enq"><img src="${$.artURI(w)}" alt=""><div><b>${e(w.title)}</b><br>${w.year} · ${$.sizeLabel(w)}<br>${$.statusLabel(w)}</div></div>` : ''}<p class="mono">Gallery: <a href="mailto:${A.gallery.email}">${A.gallery.email}</a><br>Studio: <a href="mailto:${a.email}">${a.email}</a></p></div>${contactForm(a.name + (w ? ' / ' + w.title : ''))}</div>`) };
    },
    exhibitions({ q }) {
      const s = q.get('s') || 'all', list = A.exhibitions.filter(x => s === 'all' || $.exStatus(x) === s);
      return { title: 'Exhibitions', html: big('Exhibitions', list.length) + chips('exhibitions', 's', s, [['all', 'All'], ['current', 'Now'], ['upcoming', 'Next'], ['past', 'Archive']]) + `<div class="exg">${list.map((x, i) => exCard(x, null, i)).join('') || '<p>Nothing here yet.</p>'}</div>` };
    },
    news() { return { title: 'News', html: big('News', A.news.length) + A.news.map((n, i) => newsLine(n, null, i)).join('') }; },
    shop({ q }) {
      const k = q.get('k') || 'all', list = A.products.filter(p => k === 'all' || p.kind === k);
      return { title: 'Artworks', html: big('Artworks', list.length) + chips('artworks', 'k', k, [['all', 'Everything'], ['artwork', 'Originals'], ['edition', 'Editions'], ['book', 'Books'], ['object', 'Objects']]) + `<div class="pgrid">${list.map(prodCard).join('')}</div>` };
    },
    product({ product: p }) {
      return { title: p.name, html: `<div class="wd"><div class="wd-img"><img src="${$.productImage(p)}" alt="${e(p.name)}"></div><div class="wd-t"><a class="mono" href="#/artworks">← Artworks</a><h1>${e(p.name)}</h1><p class="by">${e(p.artist ? $.artistById(p.artist).name : 'KILN Store')}</p>
        <dl class="specs">${p.spec.map(([k, v]) => `<dt>${e(k)}</dt><dd>${e(v)}</dd>`).join('')}</dl><div class="price">${$.money(p.price)}</div><div class="acts"><button class="btnk" data-add="${p.id}">Add to cart ${arrow}</button></div>
        ${p.kind === 'edition' ? `<div class="apk"><div class="apk-h"><span class="ico">${$.ICON.cube}</span><b>Try it on your wall</b></div>${$.widgetArtwork($.workById(p.work))}</div>` : ''}</div></div>` };
    },
    cart() {
      const l = $.cart.list();
      return { title: 'Cart', html: big('Cart', $.cart.count()) + (l.length ? `<div class="cart">${l.map(({ p, q }) => `<div class="ci"><img src="${$.productImage(p)}" alt=""><div><a href="${$.productHref(p)}"><b>${e(p.name)}</b></a><br><span class="mono">${$.money(p.price)}</span></div><div class="qty"><button data-qty="-1" data-id="${p.id}">−</button><span>${q}</span><button data-qty="1" data-id="${p.id}">+</button></div><b>${$.money(p.price * q)}</b></div>`).join('')}
        <div class="tot"><span>Total</span><span>${$.money($.cart.total())}</span></div><button class="btnk" onclick="this.outerHTML='<p class=mono>Demo template — checkout is connected when the site goes live.</p>'">Checkout ${arrow}</button></div>` : `<p class="mega sm">Nothing in here yet.</p><a class="btnk" href="#/artworks">Browse artworks ${arrow}</a>`) };
    },
    contact() {
      return { title: 'Contact', html: big('Say hi') + `<div class="two"><div><p class="mega sm">${A.gallery.address.join('<br>')}</p><p class="mono">${A.gallery.hours}<br>${A.gallery.phone}<br><a href="mailto:${A.gallery.email}">${A.gallery.email}</a></p></div>${contactForm('')}</div>` };
    },
    notFound() { return { title: '404', html: big('404') + '<p><a class="btnk" href="#/">Home</a></p>' }; }
  };

  function layout(html, r) {
    const top = r.path.split('/')[0];
    return `<aside class="rail"><a class="logo" href="#/">KILN<span>contemporary</span></a><button class="burger" data-toggle="menu-open" aria-label="Menu"><span class="ico">${$.ICON.menu}</span></button>
      <nav class="rnav">${NAV.map(([k, l], i) => `<a href="#/${k}" class="${top === k ? 'on' : ''}"><span class="mono">${pad(i + 1)}</span>${l}</a>`).join('')}<a href="#/cart" class="${top === 'cart' ? 'on' : ''}"><span class="mono">${$.ICON.bag.replace('<svg', '<svg class="bi"')}</span>Cart <i data-cart-count>0</i></a></nav>
      <div class="rail-ft mono">${A.gallery.address.join('<br>')}<br><br>${A.gallery.hours}<div class="rsoc">${$.socialList(A.gallery.social).map(s => `<a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.name}"><span class="ico">${s.icon}</span></a>`).join('')}</div></div></aside>
      <div class="page"><main>${html}</main><footer class="ft"><div class="ft-l">KILN</div><form class="fnl" data-demo="You’re in. ✦"><label class="mono">Newsletter</label><div><input type="email" required placeholder="you@email.com"><button class="btnk">Join ${arrow}</button></div></form><p class="mono">© 2026 KILN Contemporary</p></footer></div>`;
  }
  window.THEME = { siteName: 'KILN Contemporary', layout, views };
})();
</script><script>APT.start(window.THEME)</script>
</body></html>
